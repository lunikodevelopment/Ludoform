name: Android CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug assembleRelease assembleShowcase testDebugUnitTest test ktlintCheck :core:data:assembleDebugAndroidTest :core:launch:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: ludoform-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ludoform-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ludoform-showcase
          path: app/build/outputs/apk/showcase/*.apk
          if-no-files-found: error
